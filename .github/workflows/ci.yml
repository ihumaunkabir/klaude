name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Unit and CLI tests
        run: npm test

  package:
    name: Package and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lint install.sh
        run: shellcheck install.sh
      - name: Pack
        run: npm pack
      - name: Install the packed tarball with install.sh
        run: |
          KLAUDE_PACKAGE="$PWD/$(ls klaude-cli-*.tgz)" \
          KLAUDE_INSTALL_DIR="$RUNNER_TEMP/app" \
          KLAUDE_BIN_DIR="$RUNNER_TEMP/bin" \
          bash install.sh
          test "$("$RUNNER_TEMP/bin/klaude" --version)" = "$(node -p 'require("./package.json").version')"
